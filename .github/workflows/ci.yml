name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: rustc --version && cargo --version

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
